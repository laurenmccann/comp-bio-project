[workspace]
authors = ["laurenmccann <lcm0089@auburn.edu>"]
channels = ["conda-forge", "bioconda"]
name = "comp-bio-project"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
get-data = { cmd = "mkdir -p data && curl -L -o data/sars-cov-2.fasta https://raw.githubusercontent.com/phyletica/intro-to-comp-bio/refs/heads/main/notebooks/data/SARS-CoV-2.nextclade.aligned.fasta", description = "Download the SARS-CoV-2 alignment" }

[dependencies]
python = "3.14.*"
numpy = ">=2.5.4,<3"
scipy = ">=1.18.1,<2"
matplotlib = ">=3.11.2,<4"
iqtree = ">=3.1.4,<4"
